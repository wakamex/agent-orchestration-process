name: docs-site

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "docs-site/**"
      - "ci/build_docs.py"
      - "ci/install-zola.sh"
      - "wrangler.jsonc"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs-site-production"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    if: github.repository == 'wakamex/agent-orchestration-process'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
      - name: Build the site
        # Zola's link checker fails the build on a broken internal link.
        run: |
          ./ci/install-zola.sh
          python3 ci/build_docs.py
          cd docs-site && ../.cache/zola/0.23.4/zola build
      - name: Deploy to Cloudflare Workers
        # wrangler.jsonc serves docs-site/public as static assets on both
        # custom domains.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "7c48ce23cb4423feb34a7fe3921e307f"
        run: npx wrangler@4.69.0 deploy
