name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # AOP's own validation: its tests need bubblewrap, which the shared
  # python-validation.yml does not install.
  validate:
    uses: ./.github/workflows/validation.yml

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: wakamex/release-actions/pypi-publish@stable

  github-release:
    needs: publish
    permissions:
      contents: write
    uses: wakamex/release-actions/.github/workflows/github-release.yml@stable
