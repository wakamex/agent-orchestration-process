name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.29"
      - name: Install sandbox test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: uv --no-config lock --check
      - run: uv --no-config run --locked pytest
      - run: uv --no-config run --locked ruff check src tests
      - run: uv --no-config build --no-sources
