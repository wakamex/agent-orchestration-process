name: Validate

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install sandbox test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: uv --no-config lock --check
      - run: uv --no-config run --locked python -m unittest discover -s tests
      - run: uv --no-config run --locked ruff check src tests
      - run: uv --no-config build --no-sources
