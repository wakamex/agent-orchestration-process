[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[project]
name = "agent-orchestration-process"
version = "0.1.0"
description = "A worktree-first agent orchestration process"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AOP contributors" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/wakamex/agent-orchestration-process"
Repository = "https://github.com/wakamex/agent-orchestration-process.git"
Issues = "https://github.com/wakamex/agent-orchestration-process/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.11.10",
]

[project.scripts]
aop = "agent_orchestration_process.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
