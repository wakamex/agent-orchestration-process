[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[project]
name = "aop"
version = "0.1.0"
description = "A worktree-first agent orchestration process"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AOP contributors" }]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.11.10",
]

[project.scripts]
aop = "aop.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
