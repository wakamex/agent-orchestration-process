[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[project]
name = "agent-orchestration-process"
version = "0.1.11"
description = "Run bounded, non-interactive jobs across agent harnesses with isolation, exact resume, and provenance"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AOP contributors" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "agent-orchestration",
    "ai-agents",
    "autoresearch",
    "coding-agents",
    "git-worktrees",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]
dependencies = [
    "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/wakamex/agent-orchestration-process"
Repository = "https://github.com/wakamex/agent-orchestration-process.git"
Issues = "https://github.com/wakamex/agent-orchestration-process/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.11.10",
]

[project.scripts]
aop = "agent_orchestration_process.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
tmp_path_retention_policy = "failed"
tmp_path_retention_count = "1"
markers = [
    "live: opt-in tests that invoke authenticated external agent providers",
]
